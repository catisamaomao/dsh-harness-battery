<main id="whale-profile">
  <style>
    :root{color-scheme:light;background:#f7f4ec}body{margin:0;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    #whale-profile{--paper:#faf7ee;--ink:#28304a;--soft:#777580;--line:#d6d0c5;--accent:#605280;--wash:#eee8f1;max-width:1080px;margin:auto;color:var(--ink);font-size:14px;line-height:1.7}#whale-profile *{box-sizing:border-box}#whale-profile [hidden]{display:none!important}
    #whale-profile button,#whale-profile input{font:inherit;color:inherit}#whale-profile button{background:transparent;border:1px solid var(--line);border-radius:4px;min-height:40px;padding:7px 13px;cursor:pointer}#whale-profile button:hover{background:var(--wash)}#whale-profile button:focus-visible,#whale-profile summary:focus-visible,#whale-profile input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    #whale-profile h1,#whale-profile h2,#whale-profile h3,#whale-profile p{margin:0}#whale-profile .paper{background:var(--paper);border:1px solid var(--line);border-radius:3px;overflow:hidden}
    #whale-profile .stage{min-height:620px;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 25% 45%,#eee8f140,transparent 65%)}#whale-profile .stage:after{content:'';position:absolute;inset:14px;border:1px solid #c6bea97a;pointer-events:none;z-index:5}
    #whale-profile .portrait{position:absolute;inset:0 0 0 34%;z-index:0;margin:0;display:flex;justify-content:flex-end;align-items:center;pointer-events:none;mask-image:linear-gradient(to right,transparent,#000 18%)}#whale-profile .portrait img{width:100%;height:100%;max-height:760px;object-fit:contain;object-position:right center;mix-blend-mode:multiply}
    #whale-profile .empty-art{position:absolute;right:1%;top:16%;width:59%;height:70%;color:#a9adb94d;transform:rotate(-12deg)}#whale-profile .stage[data-theme=pending]{background:radial-gradient(ellipse at 70% 50%,#e7e9ee,transparent 70%)}
    #whale-profile .identity{position:relative;z-index:3;width:52%;padding:28px 0 0 40px}#whale-profile .eyebrow{font:10px/1.5 Georgia,serif;letter-spacing:3px;color:var(--soft);text-transform:uppercase}#whale-profile .title-row{display:flex;align-items:center;gap:17px;margin-top:9px}#whale-profile h1{font-family:"Kaiti SC",STKaiti,"Songti SC",serif;font-size:46px;font-weight:600;letter-spacing:9px;line-height:1.2;white-space:nowrap}#whale-profile .seal{display:grid;place-items:center;flex:none;width:28px;height:33px;font:20px "Songti SC",serif;color:#a85452;border:1px solid #a85452;border-radius:3px;transform:rotate(-5deg)}#whale-profile .subtitle{font:13px "Songti SC",serif;letter-spacing:6px;margin-top:15px;color:var(--soft)}
    #whale-profile .constellation{position:relative;z-index:2;width:45%;max-width:380px;margin:0 0 0 3%;filter:drop-shadow(0 2px 7px #faf7eebb)}#whale-profile .star{display:block;width:100%;height:auto;overflow:visible}#whale-profile .orbit{fill:none;stroke:#81779055;stroke-width:1}#whale-profile .star-line{fill:#faf7ee25;stroke:#6a5d85;stroke-width:1.5}#whale-profile .spoke{stroke:#93869e70;stroke-width:.7}#whale-profile .inner-ring{fill:#faf7ee72;stroke:#8d7b9c77;stroke-width:1}#whale-profile .vertex circle{fill:#faf7ee;stroke:#83788d;stroke-width:1.5}#whale-profile .vertex[data-status=observed] circle{fill:#62517e;stroke:#62517e}#whale-profile .vertex[data-status=partial] circle{fill:#ddd3e7;stroke:#62517e;stroke-dasharray:3 2}#whale-profile .vertex text{fill:#83788d;font:italic 14px Georgia,serif;text-anchor:middle}#whale-profile .center-mark{fill:#6a5d85;font:22px "Songti SC",serif;text-anchor:middle}#whale-profile .center-small{fill:#90859b;font:8px Georgia,serif;letter-spacing:3px;text-anchor:middle}
    #whale-profile .poem{position:relative;z-index:3;width:48%;margin:-6px 0 24px 3%;text-align:center;color:#4b415d;font-family:"Kaiti SC",STKaiti,"Songti SC",serif;font-size:16px;letter-spacing:4px;line-height:1.9;text-shadow:0 0 7px var(--paper),0 0 12px var(--paper)}#whale-profile .poem:before{content:'有 诗 为 记';display:block;font:10px/2.5 "Songti SC",serif;letter-spacing:6px;color:#988992;margin-bottom:3px}
    #whale-profile summary{cursor:pointer;min-height:44px}#whale-profile .footer-details{border-top:1px solid var(--line)}#whale-profile .footer-details>summary{padding:13px 22px;color:var(--soft);font-size:12px;list-style:none;display:flex;align-items:center;justify-content:space-between}#whale-profile summary::-webkit-details-marker{display:none}#whale-profile .footer-body{padding:0 22px 22px}#whale-profile .footer-body p{margin:8px 0}#whale-profile .note{color:var(--soft);font-size:12px;line-height:1.8}
    #whale-profile .dimension{border-top:1px solid var(--line)}#whale-profile .dimension>summary{display:flex;align-items:center;gap:10px;padding:12px 0;list-style:none}#whale-profile .dimension-id{font-size:11px;color:var(--soft);width:22px;flex:none}#whale-profile .dimension-label{font-size:13px;flex:1}#whale-profile .status{font-size:11px;color:var(--accent);white-space:nowrap}#whale-profile .status.unset{color:var(--soft)}#whale-profile .chevron{color:var(--soft)}#whale-profile .dimension-body{padding:0 0 18px 32px;font-size:12px;overflow-wrap:anywhere}#whale-profile .observation{padding-top:15px}#whale-profile .observation h3{font-size:14px;font-weight:500}#whale-profile .observation p{margin-bottom:10px}#whale-profile .limits{color:var(--soft);border-left:2px solid var(--line);padding-left:10px}#whale-profile .evidence-detail>summary,#whale-profile .source-detail>summary{font-size:12px;color:var(--accent);display:flex;align-items:center}#whale-profile blockquote{margin:10px 0 5px;padding:8px 10px;border-left:2px solid var(--accent);background:var(--wash);white-space:pre-wrap}#whale-profile .run-id,#whale-profile .source-meta{font-size:11px;overflow-wrap:anywhere;color:var(--soft)}#whale-profile .source-body{font-size:11px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--soft)}#whale-profile .data-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}#whale-profile input[type=file]{max-width:100%;font-size:12px}#whale-profile .error{font-size:12px;color:#9a243b;padding:10px;background:#fff0f1;overflow-wrap:anywhere}#whale-profile .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    @media(max-width:700px){body{padding:12px}#whale-profile .stage{min-height:670px}#whale-profile .identity{padding:30px 0 0 26px;width:90%}#whale-profile h1{font-size:42px;letter-spacing:7px}#whale-profile .portrait{inset:72px -17% 50px 12%;opacity:.63;mask-image:linear-gradient(to right,transparent,#000 35%)}#whale-profile .constellation{width:76%;margin:25px 0 0 1%;max-width:440px}#whale-profile .poem{width:78%;margin:0 0 32px 1%;font-size:17px;letter-spacing:3px}#whale-profile .empty-art{width:88%;right:-19%;top:22%}#whale-profile .stage:after{inset:9px}#whale-profile .footer-body{padding:0 16px 18px}}
    @media(max-width:400px){#whale-profile .stage{min-height:600px}#whale-profile .identity{padding:28px 0 0 20px}#whale-profile h1{font-size:36px}#whale-profile .constellation{width:87%;margin-top:30px}#whale-profile .poem{width:88%;font-size:16px;letter-spacing:2px}#whale-profile .dimension>summary{gap:6px}}
    @media print{body{padding:0}#whale-profile .footer-details{display:none}#whale-profile .stage{break-inside:avoid}}
  </style>

      </svg></div>
      <div class="poem" data-poem aria-label="画像评诗"></div>
    </div>
    <details class="footer-details" data-report-source><summary>翻阅此卷 <span aria-hidden="true">＋</span></summary><div class="footer-body">
      <p class="note" data-theme-rule></p><p class="note">六角依次对应授权、核验、表达、证据、异议，以及组织与汇报（D6 / D7 共用一角）。实心为有事实观察，虚线为部分证据或待复核，空心为暂无证据；位置固定，不计算强弱。原始七维记录保留如下。</p>
      <div data-dimensions aria-label="七维原始观察"></div>
      <details class="source-detail"><summary>来源与边界</summary><p class="source-meta" data-source-description></p><div data-report-limitations></div><div class="source-body" data-inventory></div></details>
      <div class="data-actions"><button type="button" data-export>导出记录</button><label for="report-import">导入记录</label><input id="report-import" data-import type="file" accept=".json,application/json"></div><p class="note">记录仅在本页读取，不上传、不写回记忆。</p>
    </div></details>
    <div class="error" data-error role="alert" hidden></div>
  </section>

</main>
