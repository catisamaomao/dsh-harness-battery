<main id="whale-profile">
  <style>
    :root{color-scheme:light dark;background:light-dark(#f4f2ed,#141b28)}
    body{margin:0;padding:32px 16px;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    #whale-profile{--paper:light-dark(#faf7ee,#1b2433);--ink:light-dark(#253047,#edf0f6);--soft:light-dark(#616777,#b8c0d0);--line:light-dark(#dddcd8,#414b5f);--accent:light-dark(#664395,#c3a6ee);--wash:light-dark(#eee7f3,#343048);max-width:1040px;margin:auto;color:var(--ink);font-size:14px;line-height:1.65}
    #whale-profile *{box-sizing:border-box}#whale-profile [hidden]{display:none!important}
    #whale-profile button,#whale-profile input{font:inherit;color:inherit}#whale-profile button{background:transparent;border:1px solid var(--line);border-radius:6px;min-height:38px;padding:7px 13px;cursor:pointer}#whale-profile button:hover{background:var(--wash)}#whale-profile button:focus-visible,#whale-profile summary:focus-visible,#whale-profile input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    #whale-profile .masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0 4px 16px}#whale-profile .brand{font-family:"Songti SC",serif;font-size:22px;letter-spacing:4px}#whale-profile .mode-switch{display:flex;gap:4px}#whale-profile .mode-switch button{border-color:transparent;font-size:13px}#whale-profile .mode-switch button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
    #whale-profile .paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}#whale-profile .stage{display:grid;grid-template-columns:54% 46%;align-items:start}#whale-profile .panel{min-width:0;padding:34px 30px 26px}#whale-profile h1,#whale-profile h2,#whale-profile h3,#whale-profile p{margin:0}#whale-profile h1{font-family:"Songti SC",serif;font-size:32px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}#whale-profile .eyebrow{font-size:11px;letter-spacing:1px;color:var(--soft);margin-bottom:7px}#whale-profile .lead{color:var(--soft);font-size:12px;margin:12px 0 21px;line-height:1.75}#whale-profile .dimension{border-top:1px solid var(--line)}#whale-profile summary{cursor:pointer;list-style:none;min-height:44px}#whale-profile summary::-webkit-details-marker{display:none}
    #whale-profile .dimension>summary{display:flex;align-items:center;gap:10px;padding:13px 0}#whale-profile .dimension-id{font-size:11px;color:var(--soft);width:22px;flex:none}#whale-profile .dimension-label{font-size:14px;flex:1;line-height:1.4}#whale-profile .status{font-size:11px;color:var(--accent);white-space:nowrap}#whale-profile .status.unset{color:var(--soft)}#whale-profile .chevron{font-size:15px;color:var(--soft);display:inline-block;transition:transform .15s}#whale-profile details[open]>.dimension-summary .chevron{transform:rotate(90deg)}
    #whale-profile .dimension-body{padding:0 0 18px 32px;font-size:12px;overflow-wrap:anywhere}#whale-profile .note{color:var(--soft);font-size:12px;line-height:1.7}#whale-profile .observation{padding-top:15px}#whale-profile .observation h3{font-size:14px;line-height:1.55;font-weight:600;margin-bottom:8px}#whale-profile .observation p{margin-bottom:10px}#whale-profile .limits{color:var(--soft);border-left:2px solid var(--line);padding-left:10px}#whale-profile .evidence-detail>summary,#whale-profile .source-detail>summary{font-size:12px;color:var(--accent);display:flex;align-items:center}#whale-profile blockquote{margin:10px 0 5px;padding:8px 10px;border-left:2px solid var(--accent);background:var(--wash);white-space:pre-wrap}#whale-profile .run-id{font-size:11px;overflow-wrap:anywhere;color:var(--soft);line-height:1.5;margin-bottom:8px}#whale-profile .source-detail{margin:4px 0}#whale-profile .source-body{font-size:11px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--soft)}
    #whale-profile .portrait{margin:0;position:sticky;top:20px;background:#f4f0e5;min-width:0}#whale-profile .portrait img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:contain}#whale-profile figcaption{padding:0 18px 14px;color:#665f72;font-size:11px;text-align:center}#whale-profile .footer-details{border-top:1px solid var(--line)}#whale-profile .footer-details>summary{padding:13px 22px;color:var(--soft);font-size:12px;display:flex;align-items:center;justify-content:space-between}#whale-profile .footer-body{padding:0 22px 20px}#whale-profile .footer-body p{margin:8px 0}#whale-profile .cover-options{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}#whale-profile .cover-options button[aria-pressed=true]{border-color:var(--accent);background:var(--wash)}#whale-profile .data-actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}#whale-profile .data-actions button{font-size:12px}#whale-profile .source-meta{font-size:11px;color:var(--soft);overflow-wrap:anywhere}#whale-profile .file-label{display:block;font-size:12px;margin:14px 0 6px}#whale-profile input[type=file]{display:block;max-width:100%;font-size:12px}#whale-profile .error{font-size:12px;color:light-dark(#9a243b,#ffb2bd);padding:9px 12px;background:light-dark(#fff0f1,#49232b);margin-top:12px;border-radius:4px;overflow-wrap:anywhere}
    #whale-profile .demo-radar{width:100%;max-width:400px;margin:auto;display:block}#whale-profile .radar-grid{fill:none;stroke:var(--line);stroke-width:1}#whale-profile .radar-data{fill:var(--wash);stroke:var(--accent);stroke-width:2}#whale-profile .demo-radar text{fill:var(--ink);font:12px sans-serif}#whale-profile .demo-radar .grade{font:italic 24px Georgia,serif}#whale-profile .demo-controls{margin-top:12px;border-top:1px solid var(--line)}#whale-profile .demo-controls>summary{font-size:12px;color:var(--soft);display:flex;align-items:center}#whale-profile .sliders{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;margin:12px 0}#whale-profile .input-head{display:flex;justify-content:space-between;gap:6px;font-size:12px}#whale-profile output{color:var(--soft);font-variant-numeric:tabular-nums}#whale-profile input[type=range]{width:100%;height:30px;margin:0;accent-color:var(--accent)}#whale-profile .ends{display:flex;justify-content:space-between;gap:5px;font-size:10px;color:var(--soft)}#whale-profile .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    @media(max-width:700px){body{padding:18px 12px}#whale-profile .stage{grid-template-columns:1fr}#whale-profile .panel{padding:26px 22px}#whale-profile .portrait{position:static}#whale-profile .portrait img{max-height:440px;object-fit:contain}#whale-profile h1{font-size:28px}#whale-profile .masthead{gap:8px}#whale-profile .mode-switch button{padding:7px 9px}}
    @media(max-width:380px){body{padding:12px 8px}#whale-profile .panel{padding:23px 16px}#whale-profile .sliders{grid-template-columns:1fr}#whale-profile .dimension-label{font-size:13px}#whale-profile .dimension>summary{gap:6px}#whale-profile .brand{font-size:20px;letter-spacing:2px}}
    @media(prefers-reduced-motion:reduce){#whale-profile .chevron{transition:none}}
  </style>
  <header class="masthead"><span class="brand">鲸相</span><nav class="mode-switch" aria-label="展示模式"><button type="button" data-mode="report" aria-pressed="true">画像报告</button><button type="button" data-mode="demo" aria-pressed="false">形象演示</button></nav></header>
  <section class="paper" aria-label="Harness 画像">
    <div class="stage">
      <section class="panel">
        <div data-report-panel>
          <p class="eyebrow">HARNESS · 画像报告</p><h1 data-profile-name></h1>
          <p class="lead">七个维度，逐项查看已观察到的行为。<br>当前没有分数或人格判定。</p>
          <p class="note" data-report-review-note></p>
          <div data-dimensions aria-label="七维观测状态"></div>
        </div>
        <div data-demo-panel hidden>
          <p class="eyebrow">DEMO · 形象演示</p><h1 data-demo-name></h1>
          <p class="lead">六轴参数仅用于展示造型，不是实际测评。</p>
          <svg class="demo-radar" data-radar role="img" viewBox="0 0 400 380" aria-labelledby="radar-title radar-description"><title id="radar-title">六轴形象演示</title><desc id="radar-description"></desc><g data-grid></g><polygon class="radar-data" data-polygon></polygon><g data-radar-labels></g></svg>
          <details class="demo-controls"><summary>调整演示参数 <span aria-hidden="true">＋</span></summary><div class="sliders" data-sliders></div><p class="note">初始六项均为 100。E → A 只表示演示倾向，不表示能力。参数变化不会改变画像报告。</p></details>
        </div>
      </section>
      <figure class="portrait"><img data-art width="600" height="900" alt="逐浪：鲸鱼娘跨步前进，握着罗盘。"><figcaption data-art-caption>自选封面 · 逐浪</figcaption></figure>
    </div>
    <details class="footer-details" data-report-source><summary>报告来源与局限 <span aria-hidden="true">＋</span></summary><div class="footer-body"><p class="source-meta" data-source-description></p><div data-report-limitations></div><details class="source-detail"><summary>查看记录清单</summary><div class="source-body" data-inventory></div></details><div class="data-actions"><button type="button" data-export>导出来源 JSON</button></div></div></details>
    <details class="footer-details" data-settings><summary>设置 <span aria-hidden="true">＋</span></summary><div class="footer-body"><p class="note">报告封面由你选择，仅作示意。</p><div class="cover-options" data-covers aria-label="选择报告封面"></div><label class="file-label" for="report-import">导入本地画像 JSON</label><input id="report-import" data-import type="file" accept=".json,application/json"><p class="note">仅在当前页面读取，不上传；不写入 Harness 或记忆。</p><div class="error" data-error role="alert" hidden></div></div></details>
  </section>
  <p class="sr" data-announcement aria-live="polite"></p>
  <script type="application/json" id="profile-source-data">__REPORT_JSON__</script>
  <script type="application/json" id="profile-schema-data">__REPORT_SCHEMA__</script>
  <script type="application/json" id="profile-demo-data">__PROFILE_VALUES__</script>
  <script type="application/json" id="profile-art-data">{"explorer":"__EXPLORER__","observer":"__OBSERVER__","collaborator":"__COLLABORATOR__"}</script>
  <script>__REPORT_CORE_JS__</script>
  <script>__PROFILE_PANEL_JS__</script>
</main>
