<main id="whale-profile">
  <style>
    :root{color-scheme:light;background:#f7f4ec}body{margin:0;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    #whale-profile{--paper:#faf7ee;--ink:#28304a;--soft:#777580;--line:#d6d0c5;--accent:#605280;--wash:#eee8f1;max-width:1080px;margin:auto;color:var(--ink);font-size:14px;line-height:1.7}#whale-profile *{box-sizing:border-box}#whale-profile [hidden]{display:none!important}
    #whale-profile h1,#whale-profile h2,#whale-profile h3,#whale-profile p{margin:0}#whale-profile .paper{background:var(--paper);border:1px solid var(--line);border-radius:3px;overflow:hidden}
    #whale-profile .stage{min-height:620px;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 25% 45%,#eee8f140,transparent 65%)}#whale-profile .stage:after{content:'';position:absolute;inset:14px;border:1px solid #c6bea97a;pointer-events:none;z-index:5}
    #whale-profile .portrait{position:absolute;inset:0 0 0 34%;z-index:0;margin:0;display:flex;justify-content:flex-end;align-items:center;pointer-events:none;mask-image:linear-gradient(to right,transparent,#000 18%)}#whale-profile .portrait img{width:100%;height:100%;max-height:760px;object-fit:contain;object-position:left center;mix-blend-mode:multiply}
    #whale-profile .empty-art{position:absolute;right:1%;top:16%;width:59%;height:70%;color:#a9adb94d;transform:rotate(-12deg)}#whale-profile .stage[data-theme=pending]{background:radial-gradient(ellipse at 70% 50%,#e7e9ee,transparent 70%)}
    #whale-profile .identity{position:relative;z-index:3;width:52%;padding:28px 0 0 40px}#whale-profile .eyebrow{font:10px/1.5 Georgia,serif;letter-spacing:3px;color:var(--soft);text-transform:uppercase}#whale-profile .title-row{display:flex;align-items:center;gap:17px;margin-top:9px}#whale-profile h1{font-family:"Kaiti SC",STKaiti,"Songti SC",serif;font-size:46px;font-weight:600;letter-spacing:9px;line-height:1.2;white-space:nowrap}#whale-profile .seal{display:grid;place-items:center;flex:none;width:28px;height:33px;font:20px "Songti SC",serif;color:#a85452;border:1px solid #a85452;border-radius:3px;transform:rotate(-5deg)}#whale-profile .subtitle{font:13px "Songti SC",serif;letter-spacing:6px;margin-top:15px;color:var(--soft)}
    #whale-profile .constellation{position:relative;z-index:2;width:45%;max-width:380px;margin:0 0 0 3%;filter:drop-shadow(0 2px 7px #faf7eebb)}#whale-profile .star{display:block;width:100%;height:auto;overflow:visible}#whale-profile .radar-disc{fill:#b59bc970;stroke:#50415f;stroke-width:2.3}#whale-profile .orbit{fill:none;stroke:#766080;stroke-width:1.15}#whale-profile .radar-grid{fill:none;stroke:#66516e66;stroke-width:1}#whale-profile .radar-fill{fill:#f5db78;fill-opacity:.96;stroke:#513b61;stroke-width:2.6;stroke-linejoin:round}#whale-profile .spoke{stroke:#55435f;stroke-width:1.05;opacity:.72}#whale-profile .radar-ticks{fill:none;stroke:#574162;stroke-width:2;stroke-dasharray:1 15.23}#whale-profile .vertex circle{fill:#ede2f2;stroke:#51405e;stroke-width:1.8}#whale-profile .vertex[data-status=observed] circle{fill:#4e375e;stroke:#4e375e}#whale-profile .vertex[data-status=partial] circle{fill:#c0a5d1;stroke:#4e375e;stroke-dasharray:3 2}#whale-profile .vertex text{fill:#493450;font:600 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.5px;text-anchor:middle;paint-order:stroke fill;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}#whale-profile .stage[data-theme=pending] .radar-fill{fill:#d3c9d9;stroke:#8c7c96;fill-opacity:.6}

    #whale-profile .poem{position:relative;z-index:3;width:48%;margin:-6px 0 24px 3%;text-align:center;color:#4b415d;font-family:"Kaiti SC",STKaiti,"Songti SC",serif;font-size:16px;letter-spacing:4px;line-height:1.9;text-shadow:0 0 7px var(--paper),0 0 12px var(--paper)}#whale-profile .poem:before{content:'有 诗 为 记';display:block;font:10px/2.5 "Songti SC",serif;letter-spacing:6px;color:#988992;margin-bottom:3px}
    #whale-profile .error{font-size:12px;color:#9a243b;padding:10px;background:#fff0f1;overflow-wrap:anywhere}
    @media(max-width:700px){body{padding:12px}#whale-profile .stage{min-height:670px}#whale-profile .identity{padding:30px 0 0 26px;width:90%}#whale-profile h1{font-size:42px;letter-spacing:7px}#whale-profile .portrait{inset:72px -17% 50px 12%;opacity:.63;mask-image:linear-gradient(to right,transparent,#000 35%)}#whale-profile .constellation{width:76%;margin:25px 0 0 1%;max-width:440px}#whale-profile .poem{width:78%;margin:0 0 32px 1%;font-size:17px;letter-spacing:3px}#whale-profile .empty-art{width:88%;right:-19%;top:22%}#whale-profile .stage:after{inset:9px}}
    @media(max-width:400px){#whale-profile .stage{min-height:600px}#whale-profile .identity{padding:28px 0 0 20px}#whale-profile h1{font-size:36px}#whale-profile .constellation{width:87%;margin-top:30px}#whale-profile .poem{width:88%;font-size:16px;letter-spacing:2px}}
    @media print{body{padding:0}#whale-profile .stage{break-inside:avoid}}
  </style>
  <section class="paper" aria-label="鲸相画像">
    <div class="stage" data-stage data-theme="pending">
      <figure class="portrait"><img data-art width="600" height="900" alt="" hidden></figure>
      <svg class="empty-art" data-empty-art viewBox="0 0 600 600" aria-hidden="true"><path d="M86 300c-13-111 116-196 235-113 60 43 66 94 112 99 56 5 77-25 71-75 51 65 15 117-39 123-19 120-166 178-294 122-79-35-103-89-85-156Z" fill="currentColor"/><path d="M150 390c98 79 222 25 236-55M220 151c-15-38-2-58 18-71M240 151c8-39 30-45 47-42" fill="none" stroke="#faf7ee" stroke-width="3"/><circle cx="166" cy="277" r="6" fill="#faf7ee"/></svg>
      <header class="identity"><p class="eyebrow">Whale · Character Chronicle</p><div class="title-row"><h1 data-profile-name>未定之相</h1><span class="seal" data-seal aria-hidden="true">待</span></div><p class="subtitle" data-subtitle>潮声未定</p></header>
      <div class="constellation"><svg class="star" viewBox="0 0 480 430" role="img" aria-labelledby="star-title star-description"><title id="star-title">六向观测雷达</title><desc id="star-description">填色轮廓为固定造型，六个节点显示证据状态。</desc>
        <circle class="radar-disc" cx="240" cy="213" r="180"/>
        <circle class="orbit" cx="240" cy="213" r="166"/>
        <circle class="radar-ticks" cx="240" cy="213" r="155"/>
        <circle class="radar-grid" cx="240" cy="213" r="122"/>
        <circle class="radar-grid" cx="240" cy="213" r="83"/>
        <circle class="radar-grid" cx="240" cy="213" r="42"/>
        <polygon class="radar-fill" points="240,63 369.9,138 369.9,288 240,363 110.1,288 110.1,138"/>
        <path class="spoke" d="M240 47V379M96.24 130L383.76 296M96.24 296L383.76 130"/>
        <g class="vertex" data-vertex="0" data-status="unknown"><title></title><circle cx="240" cy="47" r="7"/><text x="240" y="26">授权范围</text></g>
        <g class="vertex" data-vertex="1" data-status="unknown"><title></title><circle cx="383.76" cy="130" r="7"/><text x="430" y="127">核验行动</text></g>
        <g class="vertex" data-vertex="2" data-status="unknown"><title></title><circle cx="383.76" cy="296" r="7"/><text x="430" y="310">表达方式</text></g>
        <g class="vertex" data-vertex="3" data-status="unknown"><title></title><circle cx="240" cy="379" r="7"/><text x="240" y="409">证据取用</text></g>
        <g class="vertex" data-vertex="4" data-status="unknown"><title></title><circle cx="96.24" cy="296" r="7"/><text x="50" y="310">异议回应</text></g>
        <g class="vertex" data-vertex="5" data-status="unknown"><title></title><circle cx="96.24" cy="130" r="7"/><text x="50" y="127">组织汇报</text></g>
      </svg></div>
      <div class="poem" data-poem aria-label="画像评诗"></div>
    </div>
    <div class="error" data-error role="alert" hidden></div>
  </section>
  <script type="application/json" id="profile-source-data">__REPORT_JSON__</script>
  <script type="application/json" id="profile-schema-data">__REPORT_SCHEMA__</script>
  <script type="application/json" id="profile-art-data">{"explorer":"__EXPLORER__","observer":"__OBSERVER__","collaborator":"__COLLABORATOR__"}</script>
  <script>__REPORT_CORE_JS__</script>
  <script>__PROFILE_PANEL_JS__</script>
</main>
